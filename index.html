<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V-CARE: สมาร์ตกล่องคัดกรองสุขภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4fa;--card:#fff;--tx:#0f2a3d;--mu:#5b7386;--ln:#d6e6f1;--pr:#0a7ab5;--pr2:#0fb5a6;--ok:#12a150;--wn:#c77700;--cr:#d92d20;--okb:#e6f6ec;--wnb:#fff3dc;--crb:#fde8e6;--hd:linear-gradient(135deg,#0a7ab5,#0fb5a6);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;max-width:420px;height:100%;max-height:880px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(10,122,181,.2)}
@media(min-width:440px){.app{border-radius:32px;height:880px}}
.hd{background:var(--hd);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.logo b{font-size:18px;letter-spacing:1.5px;display:block;line-height:1}
.logo small{font-size:10px;opacity:.85}
.hs{font-size:11px;text-align:right;line-height:1.4}
main{flex:1;overflow-y:auto;padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:11px}
.ban{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:12px;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.btn{background:var(--pr);color:#fff;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600}
.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.chip{font-size:10px;font-weight:600;border-radius:99px;padding:2px 8px;display:inline-block}
.s0{color:var(--ok)}.s1{color:var(--wn)}.s2{color:var(--cr)}
.chip.s0{background:var(--okb)}.chip.s1{background:var(--wnb)}.chip.s2{background:var(--crb)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v{border-left:4px solid var(--ok)}.v.l1{border-left-color:var(--wn)}.v.l2{border-left-color:var(--cr)}
.num{font-size:26px;font-weight:800;line-height:1.1}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:5px 0;border-radius:9px;background:var(--bg);font-size:11px;color:var(--mu);font-weight:600}
.tab.on{background:var(--pr);color:#fff}
.tip{display:flex;gap:8px;font-size:12px;padding:8px;border-radius:10px;margin-top:6px}
.tip.t0{background:var(--okb)}.tip.t1{background:var(--wnb)}.tip.t2{background:var(--crb)}
nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav .n{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mu);padding:4px 8px}
nav .n.on{color:var(--pr);font-weight:700}
nav .n i{font-style:normal;font-size:18px}
.mid{width:58px;height:58px;border-radius:50%;background:var(--hd);color:#fff;font-size:22px;margin-top:-26px;box-shadow:0 6px 16px rgba(10,122,181,.4);border:4px solid var(--card)}
.sos{background:var(--cr);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px}
.ov{position:absolute;inset:0;background:rgba(8,30,48,.55);display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.sh h3{margin:0 0 10px;font-size:16px}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.li.on{border-color:var(--pr);background:var(--bg)}
.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--hd);transition:width .9s linear}
canvas{width:100%;height:70px;display:block}

:root{--bg:#f3f9ff;--card:#fff;--tx:#12304a;--mu:#5f7d95;--ln:#e3eef7;--pr:#1d9bf0;--pr2:#19c3b1;--ok:#10a860;--wn:#e08a00;--cr:#e5372b;--okb:#e8f8ef;--wnb:#fff4de;--crb:#ffebe8;--hd:linear-gradient(135deg,#27a9f5,#19c3b1);color-scheme:light}
body{font-size:16px}
.hd{background:#fff;color:var(--tx);border-bottom:1px solid var(--ln)}
.logo b{color:var(--pr);font-size:20px}.logo small{color:var(--mu)}
.hs{font-size:12px;color:var(--mu)}
.card{border:0;box-shadow:0 2px 14px rgba(29,155,240,.10);border-radius:20px;padding:16px}
.v,.v.l1,.v.l2{border-left:0}.v.l1{background:var(--wnb)}.v.l2{background:var(--crb)}
.num{font-size:34px}.mu{font-size:13px}.chip{font-size:12px;padding:3px 10px}
.tip{font-size:14px;line-height:1.5}
.btn{padding:10px 14px;font-size:14px}
.li{font-size:16px;padding:14px}
.cta{width:100%;background:var(--hd);color:#fff;border-radius:18px;padding:16px;font-size:18px;font-weight:700;box-shadow:0 6px 16px rgba(29,155,240,.3)}
nav{box-shadow:0 -4px 16px rgba(29,155,240,.08);border-top:0}
nav .n{font-size:12px}nav .n i{font-size:20px}
.sh{border-radius:26px 26px 0 0}

.app{background:linear-gradient(#dcefff,#f6fbff 260px)}
.hd{background:transparent;border:0}
.hero{background:var(--hd);color:#fff;border-radius:26px;padding:18px;box-shadow:0 10px 24px rgba(29,155,240,.3)}
.hero.w1{background:linear-gradient(135deg,#f6a21a,#f27b3a)}.hero.w2{background:linear-gradient(135deg,#f0584a,#d92d6a)}
.av2{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:10px;flex:none}
.sw{background:rgba(255,255,255,.22);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px}
.hb{width:100%;margin-top:14px;background:#fff;color:var(--pr);font-weight:700;border-radius:16px;padding:13px;font-size:16px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.qa i{font-style:normal;width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#e3f1ff}
.qa button:nth-child(2) i{background:#dff7f3}.qa button:nth-child(3) i{background:#fff0dc}.qa button:nth-child(4) i{background:#f0e9ff}
.sec{font-weight:700;font-size:17px;margin-top:4px}
.ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
.ihr{background:#ffe9ec}.ispo2{background:#e3f1ff}.itemp{background:#fff1dc}.ibp{background:#f1e9ff}
a.li{text-decoration:none;color:inherit}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;padding-bottom:8px;box-shadow:0 8px 24px rgba(29,155,240,.18)}
nav .n.on{background:#e3f1ff;border-radius:14px}
</style>
</head>
<body>
<div class="app">
<div class="hd">
<div class="logo">
<svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#1d9bf0"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"/><path d="M5 17h6l2-4 3 8 2-4h9" stroke="#1d9bf0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div><b>V-CARE</b><small>Smart Health Screening Box</small></div>
</div>
<div class="hs"><div id="clock">--:--</div></div>
</div>
<main id="main"></main>
<nav>
<button class="n" id="n-home" onclick="go('home')"><i>🏠</i>หน้าหลัก</button>
<button class="n" id="n-hist" onclick="go('hist')"><i>📈</i>ประวัติ</button>
<button class="mid" onclick="measure()" aria-label="ตรวจวัด">🩺</button>
<button class="n" onclick="menu()"><i>☰</i>เมนู</button>
<button class="sos" onclick="sos()">SOS</button>
</nav>
<div id="ov" class="ov" style="display:none" onclick="if(event.target===this)closeM()"><div class="sh" id="sh"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const L=['ปกติ','เฝ้าระวัง','วิกฤต'];
const P=[{id:'p1',n:'คุณยายทองคำ',a:78},{id:'p2',n:'คุณตาผ่อง สีสด',a:82},{id:'p3',n:'คุณยายสมใจ ดีงาม',a:71},{id:'p4',n:'คุณตาบุญมี ใจเย็น',a:69}];
const D=[{k:'hr',n:'อัตราการเต้นหัวใจ',u:'bpm',i:'💓'},{k:'spo2',n:'ออกซิเจนในเลือด',u:'%',i:'🫁'},{k:'temp',n:'อุณหภูมิร่างกาย',u:'°C',i:'🌡️'},{k:'bp',n:'ความดันโลหิต',u:'mmHg',i:'🩺'}];
const TIPS={hr:['','ชีพจรผิดปกติเล็กน้อย ให้นั่งพักและวัดซ้ำใน 10 นาที','ชีพจรผิดปกติมาก งดกิจกรรมหนักและติดต่อบุคลากรทางการแพทย์'],
spo2:['','ออกซิเจนค่อนข้างต่ำ หายใจเข้าลึกๆ ช้าๆ และวัดซ้ำ','ออกซิเจนต่ำมาก หากหอบเหนื่อยให้กด SOS ทันที'],
temp:['','มีไข้ต่ำๆ ดื่มน้ำมากๆ เช็ดตัวและติดตามอาการ','ไข้สูง ควรพบแพทย์โดยเร็ว'],
bp:['','ความดันสูงกว่าปกติ นั่งพัก 15 นาที ลดเค็ม และวัดซ้ำ','ความดันสูงมาก งดกิจกรรมหนัก หากแน่นหน้าอกหรือปวดศีรษะรุนแรงให้กด SOS'],
gsr:['','เริ่มมีความเครียด ลองหายใจลึกๆ หรือพักผ่อน','เครียดสูง ควรพักและพูดคุยกับคนใกล้ชิดหรือ อสม.']};
let pid='p1',view='home',mode='hr',store={},timer=null;

try{store=JSON.parse(localStorage.getItem('vcare-v2')||'{}')}catch(e){store={}}
function save(){try{localStorage.setItem('vcare-v2',JSON.stringify(store))}catch(e){}}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function normal(){return{hr:rnd(64,86),spo2:rnd(96,99),temp:+(36.1+Math.random()*.8).toFixed(1),sys:rnd(110,128),dia:rnd(70,82),gsr:rnd(10,35)}}
function hist(){
 if(!store[pid]){store[pid]=[];for(let i=6;i>=1;i--){const r=normal();r.t=Date.now()-i*864e5;store[pid].push(r)}
  const w=store[pid][3];w.sys=138;w.dia=88;save()}
 return store[pid]}
function lv(r){
 const hr=r.hr<50||r.hr>120?2:r.hr<60||r.hr>100?1:0;
 const spo2=r.spo2<90?2:r.spo2<95?1:0;
 const temp=r.temp>=38.5||r.temp<35?2:r.temp>=37.6||r.temp<36?1:0;
 const bp=r.sys>=150||r.dia>=95||r.sys<90?2:r.sys>=135||r.dia>=88?1:0;
 const gsr=r.gsr>=70?2:r.gsr>=40?1:0;
 return{hr,spo2,temp,bp,gsr}}
function score(r){const l=lv(r);return Math.max(0,100-Object.values(l).reduce((s,x)=>s+(x==2?22:x==1?8:0),0))}
const cur=()=>{const h=hist();return h[h.length-1]};
const pf=()=>P.find(p=>p.id===pid);
const fmt=t=>new Date(t).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

setInterval(()=>{$('clock').textContent=new Date().toLocaleString('th-TH',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})},1000);

function go(v){view=v;render()}
function render(){
 $('n-home').classList.toggle('on',view==='home');$('n-hist').classList.toggle('on',view==='hist');
 stopEcg();
 view==='home'?home():history_();
}
function home(){
 const r=cur(),l=lv(r),s=score(r),worst=Math.max(...Object.values(l)),p=pf();
 const col=['var(--ok)','var(--wn)','var(--cr)'][worst];
 const circ=2*Math.PI*30;
 let h=`<div class="sec">สัญญาณชีพของ ${p.n}</div>
 <div class="grid">`;
 D.forEach(d=>{const val=d.k==='bp'?r.sys+'/'+r.dia:r[d.k];h+=`<div class="card v l${l[d.k]}"><div class="ic i${d.k}">${d.i}</div><div class="mu" style="margin-top:10px">${d.n}</div><div><span class="num" ${d.k==='bp'?'style="font-size:26px"':''}>${val}</span> <span class="mu">${d.u}</span></div><span class="chip s${l[d.k]}">${L[l[d.k]]}</span></div>`});
 h+=`</div>
 <div class="card row v l${l.gsr}"><div class="row" style="gap:10px"><span style="font-size:22px">🧠</span><div><div class="mu">ระดับความเครียด (GSR)</div><b class="s${l.gsr}">${['ผ่อนคลาย (Low)','ปานกลาง (Medium)','เครียดสูง (High)'][l.gsr]}</b></div></div><span class="chip s${l.gsr}">${L[l.gsr]}</span></div>
 <div class="card"><b style="font-size:13px">👨‍⚕️ คำแนะนำการดูแลสุขภาพ</b>`;
 const tips=Object.keys(l).filter(k=>l[k]>0);
 h+=tips.length?tips.map(k=>`<div class="tip t${l[k]}"><span>${l[k]==2?'⚠️':'ℹ️'}</span><span>${TIPS[k][l[k]]}</span></div>`).join(''):`<div class="tip t0"><span>✅</span><span>สัญญาณชีพทุกค่าอยู่ในเกณฑ์ปกติ ทำกิจวัตรและออกกำลังกายเบาๆ ได้ตามปกติ ดื่มน้ำและพักผ่อนให้เพียงพอ</span></div>`;
 h+=`<div class="mu" style="margin-top:8px">* เป็นการคัดกรองเบื้องต้น ไม่ใช่การวินิจฉัยโรค</div></div>`;
 $('main').innerHTML=h;
}
const BAND={hr:[60,100],spo2:[95,100],temp:[36,37.5],sys:[90,134]};
function trend(){
 const h=hist().slice(-8),v=h.map(x=>x[mode]);if(v.length<2)return'<div class="mu">ยังมีข้อมูลไม่พอ</div>';
 const b=BAND[mode],lo=Math.min(...v,b[0])-(mode==='temp'?.3:3),hi=Math.max(...v,b[1])+(mode==='temp'?.3:3);
 const W=340,H=110,x=i=>10+i*(W-20)/(v.length-1),y=a=>H-8-(a-lo)/(hi-lo)*(H-16);
 const pts=v.map((a,i)=>x(i)+','+y(a)).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><rect x="0" y="${y(b[1])}" width="${W}" height="${y(b[0])-y(b[1])}" fill="var(--okb)"/><polyline points="${pts}" fill="none" stroke="var(--pr)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="${i==v.length-1?5:3}" fill="${a<b[0]||a>b[1]?'var(--cr)':'var(--pr)'}"/>`).join('')}</svg><div class="mu">แถบสีเขียวคือช่วงปกติ (${b[0]}–${b[1]})</div>`}

function history_(){
 const h=hist().slice().reverse(),c=cur();
 $('main').innerHTML=`<b style="font-size:20px">ประวัติและแนวโน้ม</b>
 <div class="card"><div class="row"><b>แนวโน้มย้อนหลัง</b><span class="mu">8 ครั้งล่าสุด</span></div>
 <div class="tabs" style="margin:10px 0">${[['hr','ชีพจร'],['spo2','O₂'],['temp','อุณหภูมิ'],['sys','ความดัน']].map(t=>`<button class="tab ${mode===t[0]?'on':''}" onclick="mode='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${trend()}</div>
 <div class="card"><div class="row"><b>〰️ คลื่นไฟฟ้าหัวใจ (จำลอง)</b><span class="chip s${lv(c).hr}">${c.hr} bpm</span></div><canvas id="ecg" width="360" height="70"></canvas></div>
 <b>รายการตรวจ</b>`+h.map(r=>{const w=Math.max(...Object.values(lv(r)));return`<div class="card v l${w}"><div class="row"><b>${fmt(r.t)}</b><span class="chip s${w}">${score(r)} คะแนน · ${L[w]}</span></div><div class="mu" style="margin-top:6px">💓 ${r.hr} bpm &nbsp; 🫁 ${r.spo2}% &nbsp; 🌡️ ${r.temp}°C &nbsp; 🩺 ${r.sys}/${r.dia}</div></div>`}).join('')+
 `<button class="btn o" onclick="if(confirm('ล้างประวัติของ ${pf().n}?')){delete store[pid];save();render()}">ล้างประวัติ</button>`;
 startEcg(c.hr);
}

/* ECG */
function startEcg(hr){
 const c=$('ecg');if(!c)return;const x=c.getContext('2d'),N=360,buf=new Array(N).fill(0);let ph=0;
 const g=(p,m,w)=>Math.exp(-((p-m)**2)/(2*w*w));
 const col=getComputedStyle(document.documentElement).getPropertyValue('--pr2').trim()||'#0fb5a6';
 function f(){
  for(let k=0;k<2;k++){ph=(ph+hr/3600)%1;buf.shift();buf.push(.12*g(ph,.18,.03)-.1*g(ph,.36,.008)+1*g(ph,.4,.008)-.22*g(ph,.44,.01)+.2*g(ph,.68,.05))}
  x.clearRect(0,0,N,70);x.strokeStyle=col;x.lineWidth=2;x.beginPath();
  buf.forEach((v,i)=>{const yy=55-v*42;i?x.lineTo(i,yy):x.moveTo(i,yy)});x.stroke();timer=requestAnimationFrame(f)}
 f()}
function stopEcg(){if(timer)cancelAnimationFrame(timer);timer=null}

/* Modals */
function modal(h){$('sh').innerHTML=h;$('ov').style.display='flex'}
function closeM(){$('ov').style.display='none';clearInterval(window.cd)}
function profiles(){
 modal(`<h3>เลือกผู้ใช้งาน</h3>${P.map(p=>`<button class="li ${p.id===pid?'on':''}" onclick="pid='${p.id}';closeM();render()"><span><b>${p.n}</b><div class="mu">อายุ ${p.a} ปี · ${p.id==='p1'?'โปรไฟล์ส่วนตัว':'โหมดชุมชน'}</div></span>${p.id===pid?'✔':''}</button>`).join('')}<button class="btn" style="width:100%" onclick="qr()">▦ สแกน QR ชาวบ้าน</button>`)}
function qr(){
 modal(`<h3>กำลังสแกน QR Code...</h3><p class="mu">กล้อง V-CARE กำลังอ่านบัตรประจำตัวผู้สูงอายุ</p><div class="bar"><i id="pb"></i></div>`);
 setTimeout(()=>$('pb').style.width='100%',50);
 setTimeout(()=>{pid=P[rnd(1,3)].id;closeM();render();measure()},1100)}
function measure(){
 const steps=['💓 วัดชีพจรและออกซิเจน','🌡️ วัดอุณหภูมิ','🩺 วัดความดันโลหิต','🧠 วัดระดับความเครียด'];
 modal(`<h3>กำลังตรวจวัด ${pf().n}</h3><p class="mu">สอดนิ้ว วางหน้าผาก และสวมปลอกแขนวัดความดัน</p><div class="bar"><i id="pb"></i></div><div id="st" style="margin-top:10px"></div>`);
 let i=0;const tick=()=>{if(i>=steps.length){const r=normal();if(Math.random()<.2){r.sys=rnd(136,146);r.dia=rnd(86,92)}add(r);closeM();return}
  $('st').innerHTML=steps.slice(0,i+1).map((s,j)=>`<div class="tip t${j<i?0:1}">${j<i?'✅':'⏳'} ${s}</div>`).join('');$('pb').style.width=(i+1)*25+'%';i++;setTimeout(tick,900)};tick()}
function add(r){r.t=Date.now();const h=hist();h.push(r);if(h.length>20)h.shift();save();view='home';render()}
function sos(){
 let n=5;
 const draw=()=>modal(`<div style="text-align:center"><div style="font-size:44px">🚑</div><h3>ส่งสัญญาณฉุกเฉิน</h3><div class="num s2" style="font-size:54px">${n}</div><p class="mu">กำลังส่งพิกัด GPS และผลสัญญาณชีพเข้า LINE รพ.สต. / อสม. (จำลอง)</p><button class="btn o" style="width:100%" onclick="closeM()">ยกเลิก</button></div>`);
 draw();clearInterval(window.cd);
 window.cd=setInterval(()=>{n--;if(n>0)return draw();clearInterval(window.cd);const r=cur();
  modal(`<div style="text-align:center"><div style="font-size:44px">✅</div><h3>ส่งสัญญาณแล้ว</h3></div><div class="card" style="font-family:monospace;font-size:12px;line-height:1.8">✓ LINE Alert Transmitted (4G LTE)<br>✓ ผู้ป่วย: ${pf().n} (${pf().a} ปี)<br>✓ HR ${r.hr} · SpO₂ ${r.spo2}% · ${r.temp}°C · ${r.sys}/${r.dia}<br>✓ Lat/Long: 7.5561, 99.6114</div><button class="btn" style="width:100%;margin-top:10px" onclick="closeM()">ปิด</button>`)},1000)}

function menu(){
 modal(`<h3>เมนูระบบ V-CARE</h3>
 <button class="li" onclick="profiles()">👥 จัดการผู้ใช้งาน / โหมดชุมชน<span>›</span></button>
 <button class="li" onclick="closeM();go('hist')">📈 ประวัติการตรวจย้อนหลัง<span>›</span></button>
 <button class="li" onclick="test(1)">🟠 ทดสอบ: ค่าเฝ้าระวัง<span>›</span></button>
 <button class="li" onclick="test(2)">🔴 ทดสอบ: ค่าวิกฤต<span>›</span></button>
 <div class="card mu" style="line-height:1.7">📶 4G LTE A7670E · เชื่อมต่อแล้ว<br>🔋 แบตเตอรี่ 98% · เซนเซอร์ MAX30102 / MLX90614 / NIBP / GSR พร้อมใช้งาน</div>`)}
function test(k){
 const r=k==2?{hr:125,spo2:88,temp:38.6,sys:155,dia:97,gsr:85}:{hr:108,spo2:93,temp:37.8,sys:142,dia:90,gsr:55};
 add(r);closeM()}
render();
</script>
